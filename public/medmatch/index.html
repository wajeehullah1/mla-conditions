.mtp {
  --ink: #0b1020;
  --surface: #131a2e;
  --surface-2: #1b2440;
  --line: #2a3556;
  --text: #eef1fa;
  --muted: #98a1c4;
  --brand: #4f46e5;
  --brand-lift: #6d67f0;
  --good: #10b981;
  --bad: #f43f5e;
  --warn: #f59e0b;
  position: relative;
  box-sizing: border-box;
  width: 100%;
  min-height: 100%;
  padding: 18px 16px 28px;
  background: radial-gradient(120% 90% at 50% -10%, #1a2246 0%, var(--ink) 62%);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.mtp *, .mtp *::before, .mtp *::after { box-sizing: border-box; }
.mtp button { font: inherit; color: inherit; }

.mtp-shell { max-width: 940px; margin: 0 auto; }

/* ---- HUD ---- */
.hud { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
.hud-clock {
  font-variant-numeric: tabular-nums;
  font-size: clamp(30px, 8vw, 40px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
  transition: color .18s ease;
}
.hud-clock.low { color: var(--bad); }
.hud-stats { margin-left: auto; display: flex; gap: 16px; text-align: right; }
.hud-stat-label { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.hud-stat-value { font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 650; line-height: 1; }

/* ---- Signature element: the time bar ---- */
.bar { position: relative; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-bottom: 16px; }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--brand-lift)); }
.bar-fill.low { background: linear-gradient(90deg, #e11d48, var(--bad)); }
.bar.flash-good::after,
.bar.flash-bad::after {
  content: ""; position: absolute; inset: 0; border-radius: 99px; animation: barflash .45s ease-out forwards;
}
.bar.flash-good::after { background: var(--good); }
.bar.flash-bad::after { background: var(--bad); }
@keyframes barflash { from { opacity: .85; } to { opacity: 0; } }

/* ---- Floating clock deltas ---- */
.delta-layer { position: relative; height: 0; }
.delta { position: absolute; right: 2px; top: -46px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; animation: rise .9s ease-out forwards; }
.delta.good { color: var(--good); }
.delta.bad { color: var(--bad); }
@keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 18% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }

/* ---- Board ---- */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.col-head { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 2px 2px; }

.card {
  display: flex; align-items: center; min-height: 62px;
  width: 100%; text-align: left;
  padding: 11px 12px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface);
  font-size: 13.5px; line-height: 1.32; font-weight: 500;
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease, opacity .22s ease;
}
.card:hover:not(:disabled) { border-color: #3d4a75; background: var(--surface-2); }
.card:focus-visible { outline: 2px solid var(--brand-lift); outline-offset: 2px; }
.card.selected { border-color: var(--brand-lift); background: #232c52; box-shadow: 0 0 0 3px rgba(109,103,240,.22); }
.card.correct { border-color: var(--good); background: rgba(16,185,129,.14); }
.card.wrong { border-color: var(--bad); background: rgba(244,63,94,.14); animation: shake .3s ease; }
.card.gone { opacity: 0; transform: scale(.96); pointer-events: none; }
.card.drop-target { border-color: var(--brand-lift); border-style: dashed; }
@keyframes shake { 0%,100% { transform: translateX(0); } 22% { transform: translateX(-5px); } 55% { transform: translateX(5px); } 80% { transform: translateX(-2px); } }

/* ---- Panels (intro / results / leaderboard) ---- */
.panel { max-width: 460px; margin: 6vh auto 0; text-align: center; }
.eyebrow { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--brand-lift); font-weight: 700; margin-bottom: 8px; }
.title { font-size: clamp(30px, 8vw, 42px); font-weight: 750; letter-spacing: -0.03em; line-height: 1.02; margin: 0 0 18px; }
.rules { display: inline-flex; flex-direction: column; gap: 7px; margin: 0 0 24px; padding: 0; list-style: none; text-align: left; }
.rules li { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); }
.rules b { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; color: var(--text); font-weight: 650; }
.rules b.good { color: var(--good); }
.rules b.bad { color: var(--bad); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 11px; padding: 13px 30px;
  background: var(--brand); color: #fff; font-weight: 650; font-size: 15px;
  letter-spacing: .01em; cursor: pointer;
  transition: background .14s ease, transform .1s ease;
}
.btn:hover { background: var(--brand-lift); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--brand-lift); outline-offset: 3px; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.btn.ghost:hover { border-color: #3d4a75; color: var(--text); background: transparent; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 20px; }
.score-cell { border: 1px solid var(--line); border-radius: 12px; padding: 14px 10px; background: var(--surface); }
.score-cell.wide { grid-column: 1 / -1; }
.score-num { font-size: 34px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.score-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.posted { font-size: 13px; color: var(--good); font-weight: 650; margin: -8px 0 16px; }
.pb { font-size: 13px; color: var(--warn); font-weight: 650; margin: -8px 0 16px; }

.name-row { display: flex; gap: 8px; margin: 0 0 16px; }
.input {
  flex: 1; min-width: 0; padding: 12px 13px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font-size: 14px; font-family: inherit;
}
.input:focus { outline: 2px solid var(--brand-lift); outline-offset: 1px; border-color: transparent; }

.lb { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; }
.lb-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 11px 13px; font-size: 13.5px; border-top: 1px solid var(--line); }
.lb-row:first-child { border-top: 0; }
.lb-row.head { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
.lb-row.you { background: rgba(79,70,229,.16); font-weight: 650; }
.lb-rank { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 650; }
.lb-row.you .lb-rank { color: var(--brand-lift); }
.lb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-sets { font-variant-numeric: tabular-nums; font-weight: 650; }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); font-size: 13.5px; }

.foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); text-align: center; }

/* ---- Intro lower section ---- */
.intro-lower { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); text-align: left; }
.mini-stat { border: 1px solid var(--line); border-radius: 12px; padding: 16px 12px; background: var(--surface); text-align: center; }
.mini-stat.solo { margin-bottom: 20px; }
.mini-num { font-size: 30px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
.mini-label { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.mini-head { display: flex; align-items: baseline; justify-content: space-between; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; padding: 0 2px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--brand-lift); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 650; cursor: pointer; }
.link-btn:hover { color: var(--text); }
.link-btn:focus-visible { outline: 2px solid var(--brand-lift); outline-offset: 3px; }

@media (max-width: 560px) {
  .card { min-height: 66px; font-size: 12.5px; padding: 10px; border-radius: 11px; }
  .board { gap: 8px; }
  .col { gap: 7px; }
  .panel { margin-top: 3vh; }
  .intro-lower { margin-top: 20px; padding-top: 18px; }
  .mini-num { font-size: 26px; }
  /* 16px keeps iOS from zooming the page when the name field takes focus */
  .input { font-size: 16px; }
  .btn { padding: 13px 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .mtp *, .mtp *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
