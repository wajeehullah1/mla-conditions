<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapid Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --ink:#0E1124;
  --surface:#181C33;
  --surface-2:#212642;
  --line:#2E3559;
  --line-soft:#232945;
  --accent:#8AA2FF;
  --accent-hi:#A9BBFF;
  --accent-dim:#5A6FCC;
  --good:#5EE9A0;
  --warn:#FFC65C;
  --bad:#FF7A8A;
  --bone:#E9ECF8;
  --muted:#868FB6;
  --on-accent:#0E1124;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--bone);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ECG lives only behind the countdown + play screens, which never scroll,
   so it can never run across body copy. */
#ecg{
  /* canvas is a replaced element: left/right alone leave it at its intrinsic
     300px, so the width must be set explicitly to span the viewport */
  position:fixed;left:0;bottom:0;width:100%;height:104px;
  z-index:0;opacity:0;transition:opacity .35s;pointer-events:none;
}
#ecg.live{opacity:1}

.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:1}
.screen.on{display:flex}
.pad{width:100%;max-width:680px;margin:0 auto;padding:26px 22px 60px}

/* ---------- start ---------- */
#start,#done,#board{overflow-y:auto;overscroll-behavior:contain}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.wordmark{font-size:27px;font-weight:700;letter-spacing:-.025em}
.wordmark span{color:var(--accent)}
.ghost{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);transition:.15s;
}
.ghost:hover{border-color:var(--accent-dim);color:var(--bone)}

.segment{display:flex;gap:10px;margin-bottom:16px}
.seg{
  flex:1;border:1px solid var(--line);border-radius:13px;padding:20px;
  background:var(--surface);font-family:var(--mono);font-size:25px;font-weight:600;
  letter-spacing:-.01em;transition:.15s;
}
.seg:hover{border-color:var(--accent-dim)}
.seg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.allrow{
  display:flex;align-items:center;justify-content:space-between;
  border:1px solid var(--line);border-radius:13px;background:var(--surface);
  padding:16px 18px;margin-bottom:10px;width:100%;font-size:15px;font-weight:600;transition:.15s;
}
.allrow:hover{border-color:var(--accent-dim)}
.allrow[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tick{font-family:var(--mono);font-size:11px;letter-spacing:.12em}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{
  border:1px solid var(--line-soft);border-radius:999px;padding:8px 13px;font-size:13px;
  color:var(--muted);background:var(--surface);transition:.13s;
}
.chip:hover{border-color:var(--accent-dim);color:var(--bone)}
.chip[aria-pressed="true"]{background:var(--surface-2);border-color:var(--accent);color:var(--accent)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.6;margin-left:6px}
.chips.locked{opacity:.3;pointer-events:none}

.meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:18px}
.meta b{color:var(--accent);font-weight:500}

.primary{
  width:100%;background:var(--accent);color:var(--on-accent);border-radius:13px;padding:19px;
  font-size:17px;font-weight:700;transition:.15s;
}
.primary:hover{background:var(--accent-hi)}
.primary:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}

/* ---------- countdown ---------- */
#count{align-items:center;justify-content:center}
#countNum{font-family:var(--mono);font-size:clamp(96px,27vw,200px);font-weight:600;line-height:1;color:var(--accent)}
.pulse{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}45%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}

/* ---------- play ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;max-width:900px;margin:0 auto;width:100%}
.hud div{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.01em}
#scoreVal{color:var(--accent)}
#clockVal.warn{color:var(--warn)}
#clockVal.crit{color:var(--bad)}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 24px;max-width:820px;margin:0 auto;width:100%;text-align:center}
#qspec{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
#qtext{font-size:clamp(22px,4.2vw,37px);font-weight:600;line-height:1.28;letter-spacing:-.015em;max-width:20ch}

.answerbar{padding:0 24px 116px;max-width:560px;margin:0 auto;width:100%}
.inputwrap{border:2px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .12s,background .12s}
.inputwrap.good{border-color:var(--good);background:rgba(94,233,160,.12)}
.inputwrap.bad{border-color:var(--bad);background:rgba(255,122,138,.10);animation:shake .28s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#answer{width:100%;background:none;border:none;color:var(--bone);font-family:var(--sans);font-size:20px;font-weight:500;padding:17px 19px}
#answer::placeholder{color:var(--muted);font-weight:400}
#answer:focus{outline:none}
#skipBtn{
  display:block;margin:11px auto 0;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 16px;transition:.15s;
}
#skipBtn:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- results ---------- */
.scorehead{text-align:center;padding:8px 0 26px}
#finalScore{font-family:var(--mono);font-size:clamp(70px,18vw,108px);font-weight:600;line-height:1;color:var(--accent)}
.substat{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:10px}

.note{font-size:13px;color:var(--muted);margin-bottom:20px}
.namerow{display:flex;gap:9px;margin-bottom:22px}
#nameInput{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--bone);font-family:var(--sans);font-size:15px;padding:14px 15px}
#nameInput:focus{outline:none;border-color:var(--accent)}
#saveBtn{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:14px 24px;font-weight:600;font-size:14px}
#saveBtn:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}

.review{border:1px solid var(--line-soft);border-radius:13px;overflow:hidden;margin-bottom:22px}
.rrow{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line-soft);font-size:13px}
.rrow:last-child{border-bottom:none}
.rmark{font-family:var(--mono);font-size:12px;width:13px;flex-shrink:0}
.rmark.ok{color:var(--good)}
.rmark.no{color:var(--bad)}
.rq{color:var(--muted);line-height:1.45}
.ra{color:var(--bone);font-weight:600}
.rgiven{color:var(--bad);text-decoration:line-through;font-weight:400}

.btnrow{display:flex;gap:9px}
.btnrow button{flex:1;border:1px solid var(--line);border-radius:12px;padding:15px 8px;font-size:14px;font-weight:600;transition:.15s}
.btnrow button:hover{border-color:var(--accent-dim)}
.btnrow .fill{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btnrow .fill:hover{background:var(--accent-hi)}

/* ---------- leaderboard ---------- */
.lbtabs{display:flex;gap:9px;margin-bottom:16px}
.lbtab{flex:1;border:1px solid var(--line);border-radius:11px;padding:13px;font-family:var(--mono);font-size:14px;transition:.15s}
.lbtab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.lbrow{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line-soft)}
.lbrank{font-family:var(--mono);font-size:13px;color:var(--muted);width:24px}
.lbrow.top .lbrank{color:var(--accent);font-weight:600}
.lbname{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbscore{font-family:var(--mono);font-size:16px;font-weight:600}
.lbrow.mine{background:var(--surface)}
.lbempty{text-align:center;color:var(--muted);font-size:13px;padding:44px 20px}

@media (max-width:520px){
  .pad{padding:20px 16px 50px}
  .hud{padding:16px 18px}
  .stage{padding:12px 18px}
  .answerbar{padding:0 18px 96px}
  #ecg{height:84px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- answer matching (validated offline) ---------- */
const TAIL = ["disease","syndrome","disorder","sign","test","reaction","phenomenon","maneuver","manevre"];
function norm(s){
  let t = (s||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/['\u2019]/g,"")
    .replace(/[^a-z0-9\s-]/g," ")
    .replace(/-/g," ")
    .replace(/\s+/g," ")
    .trim();
  t = t.replace(/^(the|a|an)\s+/,"");
  t = t.replace(/ae/g,"e").replace(/oe/g,"e");
  let changed = true;
  while(changed){
    changed = false;
    for(const w of TAIL){
      if(t.length > w.length + 1 && t.endsWith(" "+w)){ t = t.slice(0,-(w.length+1)).trim(); changed = true; }
    }
  }
  return t;
}
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  if(Math.abs(m-n)>2) return 9;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
// KNOWN holds every real answer in the bank. Anything the student types that IS
// one of those terms is treated as a deliberate answer, never as a typo of a
// different one — this is what stops "hepatitis b" scoring on "Hepatitis A",
// "nephrotic" on "Nephritic", or "macrocytic" on "Microcytic".
let KNOWN = new Set(), KNOWN_LIST = [], AMBIGUOUS_HEADS = new Set();
function setKnown(list){
  KNOWN_LIST = [...new Set(list.map(norm))].filter(Boolean);
  KNOWN = new Set(KNOWN_LIST);
  // A leading word that begins more than one term in the bank identifies none of
  // them on its own: "diabetic" fits five answers, "acute" three. Crediting it
  // would let a player farm score off generic stems instead of recalling a term.
  const heads = new Map();
  for(const a of KNOWN_LIST){
    if(!a.includes(" ")) continue;
    const head = a.split(" ")[0];
    heads.set(head, (heads.get(head)||0)+1);
  }
  AMBIGUOUS_HEADS = new Set([...heads].filter(([,n])=>n>1).map(([h])=>h));
}

// Reject a near-miss whose only difference sits inside a 1-2 character token
// ("Type 1" vs "Type 2", "Hepatitis A" vs "Hepatitis B").
function shortTokenDiff(g,a){
  const gt=g.split(" "), at=a.split(" ");
  if(gt.length!==at.length) return false;
  for(let i=0;i<gt.length;i++){
    if(gt[i]!==at[i] && (gt[i].length<=2 || at[i].length<=2)) return true;
  }
  return false;
}
function typoMatch(g,a){
  if(a.length < 5) return false;
  if(Math.abs(g.length-a.length) > 1) return false;
  if(g.slice(0,3) !== a.slice(0,3)) return false;   // guards macro/micro, ileum/ilium, ab-/ad-
  if(shortTokenDiff(g,a)) return false;
  if(/\d/.test(g) || /\d/.test(a)) return g===a;    // never fuzzy-match numbered terms
  return lev(g,a) <= 1;
}
// A near-miss sitting one edit from two or more real terms is ambiguous and
// cannot be credited: "hyprtension" is equally close to hypertension and
// hypotension, "empysema" to emphysema and empyema.
function ambiguous(g){
  let n = 0;
  for(const k of KNOWN_LIST){ if(typoMatch(g,k) && ++n > 1) return true; }
  return false;
}
function isCorrect(given, accepted){
  const g = norm(given);
  if(!g) return false;
  const acc = accepted.map(norm).filter(Boolean);
  for(const a of acc){ if(g===a) return true; }
  // typed a real but different term from the bank -> a wrong answer, not a typo
  if(KNOWN.has(g) && !acc.includes(g)) return false;
  if(ambiguous(g)) return false;
  for(const a of acc){
    if(typoMatch(g,a)) return true;
    if(a.includes(" ")){
      const head=a.split(" ")[0];
      // the leading word must be spelled exactly - no typo allowance here,
      // or "heptitis" would score on "Hepatitis A" - and it must belong to this
      // term alone, or one generic stem scores across unrelated conditions.
      if(head.length>=5 && g===head && !AMBIGUOUS_HEADS.has(head)) return true;
    }
  }
  return false;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function beginCountdown(){
  S.queue=shuffle(pool().slice()); S.idx=0; S.score=0; S.results=[]; S.ranked=S.all; S.lastEntry=null; S.posting=false;
  show("count");
  ecg.reset();
  let n=3; const num=$("countNum");
  const beat=t=>{num.textContent=t;num.classList.remove("pulse");void num.offsetWidth;num.classList.add("pulse");};
  beat(3);
  const iv=setInterval(()=>{
    n--;
    if(n>0) beat(n);
    else { clearInterval(iv); beat("Go"); setTimeout(runRound,400); }
  },1000);
}
function runRound(){
  show("play"); S.running=true;
  S.endsAt=performance.now()+S.duration*1000; S.lastTick=null;
  $("scoreVal").textContent="0";
  $("clockVal").textContent=fmtTime(S.duration);
  $("answer").value="";
  paintQuestion(); focusAnswer(); tick();
}
function tick(){
  if(!S.running) return;
  const now=performance.now();
  // A backgrounded tab freezes rAF, so the first frame back carries the whole
  // absence at once and the round would expire on the spot. Push the deadline
  // out by the gap to hand that wall-clock time back, as ABG Ninja does.
  const gap=now-(S.lastTick??now);
  if(gap>1200) S.endsAt+=gap-16;
  S.lastTick=now;
  const left=Math.max(0,S.endsAt-now);
  const secs=Math.ceil(left/1000);
  const cv=$("clockVal");
  cv.textContent=fmtTime(secs);
  cv.classList.toggle("warn",secs<=10&&secs>5);
  cv.classList.toggle("crit",secs<=5);
  if(left<=0){ endRound(); return; }
  S.raf=requestAnimationFrame(tick);
}
function paintQuestion(){
  if(S.idx>=S.queue.length) S.idx=0;
  const q=S.queue[S.idx];
  $("qspec").textContent=SPECIALTIES[q.s];
  $("qtext").textContent=q.q;
}
function flash(cls){
  const w=$("inputWrap");
  w.classList.remove("good","bad"); void w.offsetWidth; w.classList.add(cls);
  setTimeout(()=>w.classList.remove(cls), cls==="good"?200:300);
}
function advance(){ S.idx++; paintQuestion(); $("answer").value=""; }
function submit(){
  if(!S.running) return;
  const q=S.queue[S.idx], given=$("answer").value;
  if(!given.trim()) return;
  if(isCorrect(given,q.a)){
    S.score++; $("scoreVal").textContent=S.score;
    S.results.push({q:q.q,a:q.a[0],given:given.trim(),ok:true});
    flash("good"); ecg.pulse("good"); advance();
  } else { flash("bad"); ecg.pulse("bad"); $("answer").value=""; }
}
function skip(){
  if(!S.running) return;
  const q=S.queue[S.idx];
  S.results.push({q:q.q,a:q.a[0],given:$("answer").value.trim(),ok:false});
  flash("bad"); ecg.pulse("bad"); advance();
}
$("answer").addEventListener("keydown",e=>{

  else if(e.key==="Escape"||(e.key==="Tab"&&!e.shiftKey)){e.preventDefault();skip();}
});

// in an iframe on the site, under a header with profile and sign-in controls,
// and an unguarded refocus yanks the caret out of those modals on every click.
$("answer").addEventListener("blur",()=>{ if(S.running) setTimeout(()=>{ if(document.hasFocus()) focusAnswer(); },0); });
$("play").addEventListener("mousedown",e=>{ if(S.running&&e.target.id!=="skipBtn"){e.preventDefault();focusAnswer();} });
document.addEventListener("keydown",e=>{ if(S.running&&document.activeElement!==$("answer")&&e.key.length===1) focusAnswer(); });

/* ---------- results ---------- */
/* Hand the finished round to the dashboard so it can award the day's point.
   Targeted at this origin rather than "*" — the page is only ever framed by the
   site that serves it, and a wildcard would leak the round to any other framer. */
function reportRound(summary){
  try{
    if(typeof window.MLA_onGameComplete==="function") window.MLA_onGameComplete(summary);
    if(window.parent&&window.parent!==window)
      window.parent.postMessage({type:"mla:game-complete",payload:summary},window.location.origin);
  }catch(e){}
}

function endRound(){
  S.running=false;
  if(S.raf) cancelAnimationFrame(S.raf);
  const att=S.results.length, acc=att?Math.round(S.score/att*100):0;
  $("finalScore").textContent=S.score;
  $("substat").textContent=att+" attempted · "+acc+"% · "+fmtTime(S.duration);
  const rev=$("review"); rev.innerHTML="";
  if(!att) rev.innerHTML='<div class="lbempty">Nothing answered</div>';
  else S.results.slice().reverse().forEach(r=>{
    const d=document.createElement("div"); d.className="rrow";
    const given=(!r.ok&&r.given)?' <span class="rgiven">'+esc(r.given)+'</span>':"";
    d.innerHTML='<div class="rmark '+(r.ok?"ok":"no")+'">'+(r.ok?"✓":"✕")+'</div>'+
                '<div class="rq">'+esc(r.q)+'<br><span class="ra">'+esc(r.a)+'</span>'+given+'</div>';
    rev.appendChild(d);
  });
  const z=$("saveZone");
  if(!S.ranked){ z.innerHTML='<div class="note">Filtered rounds aren\'t ranked.</div>'; }
  else{
    z.innerHTML='<div class="namerow"><input id="nameInput" maxlength="18" placeholder="Your name" autocomplete="off"><button id="saveBtn">Post</button></div>';
    $("saveBtn").addEventListener("click",()=>saveScore($("nameInput").value));
    $("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveScore($("nameInput").value);});
  }
  reportRound({
    game:"rapid-recall", version:1,
    score:S.score, attempted:att, accuracy:acc,
    durationMs:S.duration*1000, ranked:S.ranked, finishedAt:Date.now()
  });
  show("done");
}

/* ---------- leaderboard ---------- */
const memBoard={30:[],60:[]}; let storageOK=true;
async function loadBoard(d){
  if(!storageOK||!window.storage) return memBoard[d];
  try{ const r=await window.storage.get("rapidrecall:lb:"+d,true); return r?JSON.parse(r.value):[]; }
  catch(e){ return []; }
}
async function writeBoard(d,rows){
  if(!storageOK||!window.storage){ memBoard[d]=rows; return; }
  try{ await window.storage.set("rapidrecall:lb:"+d,JSON.stringify(rows),true); }
  catch(e){ storageOK=false; memBoard[d]=rows; }
}
async function saveScore(raw){
  // Held Enter repeats the keydown, and the awaits below leave a window where a
  // second call slips past the button's disabled flag and posts a duplicate row.
  if(S.posting) return;
  S.posting=true;
  const name=(raw||"").trim().slice(0,18)||"Anonymous";
  const b=$("saveBtn"); if(b){b.disabled=true;b.textContent="…";}
  const d=S.duration, rows=await loadBoard(d);
  const entry={name,score:S.score,at:Date.now()};
  rows.push(entry); rows.sort((x,y)=>y.score-x.score||x.at-y.at);
  await writeBoard(d,rows.slice(0,100));
  S.lastEntry=entry; openBoard(d);
}
async function openBoard(d){
  // Remember where the board was opened from, so Back returns there rather than
  // to whatever the last finished round left behind.
  S.prevScreen=document.querySelector(".screen.on")?.id||"start";
  S.lbTab=d||S.lbTab;
  document.querySelectorAll(".lbtab").forEach(t=>t.setAttribute("aria-pressed",(+t.dataset.lb===S.lbTab)?"true":"false"));
  show("board");
  $("lbList").innerHTML='<div class="lbempty">…</div>';
  const rows=await loadBoard(S.lbTab), el=$("lbList");
  if(!rows.length){ el.innerHTML='<div class="lbempty">No scores yet</div>'; return; }
  el.innerHTML="";
  rows.slice(0,25).forEach((r,i)=>{
    const d2=document.createElement("div");
    d2.className="lbrow"+(i<3?" top":"")+(S.lastEntry&&r.at===S.lastEntry.at&&r.name===S.lastEntry.name?" mine":"");
    d2.innerHTML='<div class="lbrank">'+(i+1)+'</div><div class="lbname">'+esc(r.name)+'</div><div class="lbscore">'+r.score+'</div>';
    el.appendChild(d2);
  });
}
document.querySelectorAll(".lbtab").forEach(t=>t.addEventListener("click",()=>openBoard(+t.dataset.lb)));

/* ---------- ECG ----------
   One sweep = one full crossing of the screen. Sweeps alternate:
   two evenly spaced beats, then a single beat dead centre, repeating.
   Purely rhythmic - answers tint the trace but never add a beat. */
const ecg = (()=>{
  const NOOP={reset(){},pulse(){}};
  try{
    const c=$("ecg"); if(!c||!c.getContext) return NOOP;
    const ctx=c.getContext("2d"); if(!ctx) return NOOP;
    const reduced=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);

    const SWEEP_MS=4200;      // time for one full crossing
    const BEAT_W=0.085;       // beat width as a fraction of screen width
    let w=0,h=0,dpr=1,t0=performance.now(),sweep=0,prevX=null,prevY=0,tint=null,tintUntil=0;

    function size(){
      dpr=Math.min(window.devicePixelRatio||1,2);
      w=c.clientWidth; h=c.clientHeight;
      c.width=Math.max(1,w*dpr); c.height=Math.max(1,h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,w,h); prevX=null;
    }
    window.addEventListener("resize",size);

    // single PQRST complex, u = distance from beat centre in beat-widths
    function complex(u){
      if(u<-1||u>1) return 0;
      const g=(x,c0,s)=>Math.exp(-Math.pow((x-c0)/s,2));
      return 0.10*g(u,-0.55,0.10)   // P
           - 0.16*g(u,-0.10,0.035)  // Q
           + 1.00*g(u, 0.00,0.028)  // R
           - 0.30*g(u, 0.10,0.045)  // S
           + 0.19*g(u, 0.45,0.130); // T
    }
    // beat centres for this sweep: 2 evenly spaced, then 1 centred
    function centres(n){ return (n%2===0) ? [1/3,2/3] : [0.5]; }
    function valueAt(p,n){
      let v=0;
      for(const c0 of centres(n)) v+=complex((p-c0)/BEAT_W);
      return v;
    }

    function frame(now){
      if(!c.classList.contains("live")){ prevX=null; t0=now; requestAnimationFrame(frame); return; }
      if(w!==c.clientWidth || h!==c.clientHeight) size();
      const mid=h*0.56, amp=h*0.40;
      let elapsed=now-t0;
      while(elapsed>=SWEEP_MS){ elapsed-=SWEEP_MS; t0+=SWEEP_MS; sweep++; }
      const p=reduced?1:elapsed/SWEEP_MS;
      const x=p*w, y=mid-valueAt(p,sweep)*amp;

      if(prevX===null||x<prevX){ ctx.clearRect(0,0,w,h); prevX=x; prevY=y; }
      // erase a short gap ahead of the cursor so the sweep reads as a monitor
      ctx.clearRect(x,0,26,h);
      ctx.strokeStyle = (now<tintUntil&&tint) ? tint : "#5A6FCC";
      ctx.lineWidth=1.9; ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.beginPath(); ctx.moveTo(prevX,prevY); ctx.lineTo(x,y); ctx.stroke();
      prevX=x; prevY=y;
      requestAnimationFrame(frame);
    }
    size(); requestAnimationFrame(frame);
    return {
      reset(){ t0=performance.now(); sweep=0; prevX=null; ctx.clearRect(0,0,w,h); },
      pulse(kind){ tint = kind==="good" ? "#5EE9A0" : "#FF7A8A"; tintUntil=performance.now()+420; }
    };
  }catch(e){ console.warn("ECG disabled:",e); return NOOP; }
})();
</script>
